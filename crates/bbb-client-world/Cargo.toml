[package]
name = "bbb-client-world"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bbb-client-clock = { path = "../bbb-client-clock" }
bbb-client-assets = { path = "../bbb-client-assets" }
bbb-facts = { path = "../bbb-facts", default-features = false, features = ["client-facts"] }
bbb-protocol = { path = "../bbb-protocol" }
bbb-registry-codec = { path = "../bbb-registry-codec" }
bbb-render-types = { path = "../bbb-render-types" }
chrono = { workspace = true }
rsa = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono-tz = { workspace = true }
icu_calendar = { workspace = true }
icu_datetime = { workspace = true }
icu_decimal = { workspace = true }
icu_locale = { workspace = true }
icu_time = { workspace = true }
writeable = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "entity_projection"
harness = false

[[bench]]
name = "publication_snapshot"
harness = false
