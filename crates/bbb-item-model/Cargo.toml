[package]
name = "bbb-item-model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes the `NativeItemRuntime` test constructors (`empty_for_test`,
# `for_test_with_registry_and_equipment_assets`) to downstream crates' tests
# without compiling them into production builds.
test-support = []

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bbb-pack = { path = "../bbb-pack" }
bbb-protocol = { path = "../bbb-protocol" }
bbb-render-types = { path = "../bbb-render-types" }
bbb-world = { path = "../bbb-world" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
glam = { workspace = true }
icu_calendar = { workspace = true }
icu_datetime = { workspace = true }
icu_decimal = { workspace = true }
icu_locale = { workspace = true }
icu_time = { workspace = true }
reqwest = { workspace = true }
rsa = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
writeable = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
image = { workspace = true }
rand = { workspace = true }
