[package]
name = "bbb-renderer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
lifecycle-soak = []

[dependencies]
anyhow = { workspace = true }
bbb-pack = { path = "../bbb-pack" }
bbb-render-types = { path = "../bbb-render-types" }
bytemuck = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
pollster = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
wgpu = { workspace = true, features = ["glsl", "naga-ir"] }
winit = { workspace = true }

[dev-dependencies]
bbb-protocol = { path = "../bbb-protocol" }
criterion = { workspace = true }

[[bench]]
name = "terrain_residency"
harness = false

[[bench]]
name = "frame_extraction_storage"
harness = false

[[bench]]
name = "item_model_residency"
harness = false
