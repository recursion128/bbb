[package]
name = "bbb-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
lifecycle-soak = ["bbb-renderer/lifecycle-soak"]

[[bin]]
name = "bbb-native"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
bbb-audio = { path = "../bbb-audio", features = ["device"] }
bbb-control = { path = "../bbb-control" }
bbb-item-model = { path = "../bbb-item-model" }
bbb-net = { path = "../bbb-net" }
bbb-pack = { path = "../bbb-pack" }
bbb-platform-macos = { path = "../bbb-platform-macos" }
bbb-protocol = { path = "../bbb-protocol" }
bbb-render-types = { path = "../bbb-render-types" }
bbb-renderer = { path = "../bbb-renderer" }
bbb-world = { path = "../bbb-world" }
chrono = { workspace = true }
chrono-tz = { workspace = true }
clap = { workspace = true }
glam = { workspace = true }
hexf-parse = { workspace = true }
isocountry = { workspace = true }
libc = { workspace = true }
pollster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sys-locale = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
winit = { workspace = true }
zip = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = { workspace = true }

[dev-dependencies]
bbb-item-model = { path = "../bbb-item-model", features = ["test-support"] }
image = { workspace = true }
