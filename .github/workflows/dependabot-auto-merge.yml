name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify Dependabot PR
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update automerge eligibility label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
        run: |
          set -euo pipefail
          eligible=false
          if [[ "$ECOSYSTEM" == "github_actions" || "$ECOSYSTEM" == "github-actions" ]]; then
            eligible=true
          elif [[ "$ECOSYSTEM" == "cargo" || "$ECOSYSTEM" == "uv" ]]; then
            # Grouped PRs from dependabot.yml only include non-breaking minor/patch updates
            # (respecting Cargo 0.x breaking semantics). Ungrouped patch updates (e.g. security
            # fixes) are also eligible; ungrouped 0.x->0.y or major bumps require manual review.
            case "$DEPENDENCY_GROUP" in
              wasm-bindgen|icu4x|cargo-minor-patch|python-tools)
                eligible=true
                ;;
              "")
                if [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]]; then
                  eligible=true
                fi
                ;;
            esac
          fi

          if [[ "$eligible" == "true" ]]; then
            # Use REST endpoints directly; `gh pr edit` hits GraphQL errors when Issues/Projects are disabled.
            gh api -X POST "repos/${GH_REPO}/labels" \
              -f name="automerge" \
              -f color="0E8A16" \
              -f description="Eligible for automatic merge after CI succeeds" >/dev/null 2>&1 || true
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
              -f "labels[]=automerge" >/dev/null
            echo "Labeled PR #${PR_NUMBER} for auto-merge (${ECOSYSTEM}, group=${DEPENDENCY_GROUP:-none}, ${UPDATE_TYPE})."
          else
            gh api -X DELETE "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/automerge" >/dev/null 2>&1 || true
            echo "Skipped auto-merge for PR #${PR_NUMBER} (${ECOSYSTEM}, group=${DEPENDENCY_GROUP:-none}, ${UPDATE_TYPE}); requires manual review."
          fi

  merge:
    name: Auto-Merge Verified Dependabot PR
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge Dependabot PR after CI passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          pr_number=$(gh api \
            -X GET "repos/${GH_REPO}/pulls" \
            -f state=open \
            -f base=main \
            -f head="${REPO_OWNER}:${HEAD_BRANCH}" \
            | jq -r --arg sha "$HEAD_SHA" --arg repo "$GH_REPO" '
              map(select(
                .user.login == "dependabot[bot]"
                and (.draft | not)
                and .head.sha == $sha
                and .head.repo.full_name == $repo
                and ((.labels | map(.name) | index("automerge")) != null)
              )) | .[0].number // empty
            ')

          if [[ -z "$pr_number" ]]; then
            echo "No eligible open Dependabot PR matching ${HEAD_BRANCH}@${HEAD_SHA}; nothing to merge."
            exit 0
          fi

          # Ensure every commit on the PR was authored by dependabot[bot].
          non_dependabot=$(gh api "repos/${GH_REPO}/pulls/${pr_number}/commits" --paginate \
            | jq -s -r '[.[][] | select((.author.login // "") != "dependabot[bot]")] | length')
          if [[ "$non_dependabot" != "0" ]]; then
            echo "PR #${pr_number} contains ${non_dependabot} commit(s) not authored by dependabot[bot]; skipping auto-merge."
            exit 0
          fi

          if gh api -X PUT "repos/${GH_REPO}/pulls/${pr_number}/merge" \
            -f merge_method=squash \
            -f sha="$HEAD_SHA" >/dev/null; then
            gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${HEAD_BRANCH}" >/dev/null 2>&1 || true
            echo "Merged PR #${pr_number} (${HEAD_BRANCH}@${HEAD_SHA})."
          else
            gh pr merge "$pr_number" \
              --repo "$GH_REPO" \
              --auto \
              --squash \
              --delete-branch \
              --match-head-commit "$HEAD_SHA"
          fi
