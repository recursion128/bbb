[workspace]
resolver = "2"
members = [
    "crates/bbb-audio",
    "crates/bbb-item-model",
    "crates/bbb-native",
    "crates/bbb-protocol",
    "crates/bbb-net",
    "crates/bbb-world",
    "crates/bbb-pack",
    "crates/bbb-render-types",
    "crates/bbb-renderer",
    "crates/bbb-control",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
aes = "0.8"
anyhow = "1"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
arc-swap = "1"
base64 = "0.22"
bytes = "1"
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
flate2 = "1"
glam = "0.29"
hecs = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
isocountry = "0.3.2"
kira = { version = "0.12.1", default-features = false, features = ["ogg", "vorbis"] }
md5 = "0.7"
num-bigint = "0.4"
pollster = "0.3"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rsa = "0.9"
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
symphonia = { version = "0.5.5", default-features = false, features = ["ogg", "vorbis"] }
sys-locale = "0.3.2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode_names2 = "=3.1.0"
unicode-bidi = "0.3.18"
unicode-character-database = "0.1.0"
url = "2"
uuid = { version = "1", features = ["serde"] }
wgpu = "0.19"
winit = "0.29"
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }

[workspace.lints.rust]
# deny-warnings lives here (not in RUSTFLAGS) so gate and daily focused tests
# share one build fingerprint; a RUSTFLAGS='-D warnings' toggle invalidates the
# whole /tmp/bbb-target-* cache in both directions.
warnings = "deny"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.fast-test]
inherits = "dev"
opt-level = 0
incremental = true

[profile.fast-test.package."*"]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
