[workspace]
resolver = "2"
members = [
    "crates/bbb-admin",
    "crates/bbb-client-audio",
    "crates/bbb-client-clock",
    "crates/bbb-client",
    "crates/bbb-protocol",
    "crates/bbb-client-net",
    "crates/bbb-client-probe",
    "crates/bbb-server-admin",
    "crates/bbb-server-net",
    "crates/bbb-server-core",
    "crates/bbb-server-types",
    "crates/bbb-server-datapack",
    "crates/bbb-server-worldgen",
    "crates/bbb-server-persistence",
    "crates/bbb-server",
    "crates/bbb-client-world",
    "crates/bbb-client-assets",
    "crates/bbb-render-types",
    "crates/bbb-client-render",
    "crates/bbb-facts",
    "crates/bbb-mcp",
    "crates/bbb-registry-codec",
    "crates/bbb-web-host",
    "crates/bbb-xtask",
]

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ab_glyph = "0.2.32"
anyhow = "1"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
arc-swap = "1"
base64 = "0.23"
bytes = "1"
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5"
criterion = "0.8.2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
getrandom = { version = "0.2", features = ["js"] }
glam = "0.34.3"
hashbrown = { version = "0.17.1", default-features = false }
hexf-parse = "0.2.1"
icu_calendar = "2.2"
icu_datetime = "2.2"
icu_decimal = "2.2"
icu_locale = "2.2"
icu_time = { version = "2.2", features = ["unstable_chrono_0_4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = "2"
isocountry = "0.3.2"
libc = "0.2"
libloading = "0.8"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
md5 = "0.8.1"
num-bigint = "0.5.1"
pollster = "1.0.1"
rand = "0.10.2"
rayon = "1.12"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "socks"] }
rsa = "0.9"
rustc-hash = "1.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
symphonia = { version = "0.6.0", default-features = false, features = ["ogg", "vorbis", "opt-simd"] }
sys-locale = "0.3.2"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
twox-hash = { version = "2", default-features = false, features = ["xxhash32"] }
unicode_names2 = "=3.1.0"
unicode-bidi = "0.3.18"
unicode-character-database = "0.1.0"
url = "2"
writeable = "0.6"
uuid = { version = "1", features = ["serde"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
web-sys = "0.3.104"
web-time = "1.1.0"
js-sys = "0.3.104"
wgpu = { version = "30.0.2", default-features = false }
winit = "0.30.13"
x11-dl = "2.21.0"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
# deny-warnings lives here (not in RUSTFLAGS) so gate and daily focused tests
# share one build fingerprint; a RUSTFLAGS='-D warnings' toggle invalidates the
# whole /tmp/bbb-target-* cache in both directions.
warnings = "deny"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.fast-test]
inherits = "dev"
opt-level = 0
incremental = true

[profile.fast-test.package."*"]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
opt-level = "s"

[profile.wasm-release.package.bbb-client-render]
opt-level = 3

[profile.wasm-release.package.bbb-client-world]
opt-level = 3

[profile.wasm-release.package.bbb-protocol]
opt-level = 3
