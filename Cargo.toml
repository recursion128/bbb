[workspace]
resolver = "2"
members = [
    "crates/bbb-audio",
    "crates/bbb-item-model",
    "crates/bbb-native",
    "crates/bbb-protocol",
    "crates/bbb-net",
    "crates/bbb-world",
    "crates/bbb-pack",
    "crates/bbb-platform-macos",
    "crates/bbb-render-types",
    "crates/bbb-renderer",
    "crates/bbb-control",
]

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
al-sys = "0.6.1"
anyhow = "1"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
arc-swap = "1"
base64 = "0.22"
bytes = "1"
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
criterion = "0.8.2"
flate2 = "1"
glam = "0.33.3"
hecs = "0.11.1"
hexf-parse = "0.2.1"
icu_calendar = "2.2"
icu_datetime = "2.2"
icu_decimal = "2.2"
icu_locale = "2.2"
icu_time = { version = "2.2", features = ["unstable_chrono_0_4"] }
image = { version = "0.25", default-features = false, features = ["png"] }
isocountry = "0.3.2"
kira = { version = "0.12.1", default-features = false, features = ["ogg", "vorbis"] }
libc = "0.2"
md5 = "0.8.1"
num-bigint = "0.5.1"
pollster = "1.0.1"
rand = "0.10.2"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls-no-provider", "socks"] }
rsa = "0.9"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
symphonia = { version = "0.6.0", default-features = false, features = ["ogg", "vorbis"] }
sys-locale = "0.3.2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode_names2 = "=3.1.0"
unicode-bidi = "0.3.18"
unicode-character-database = "0.1.0"
url = "2"
writeable = "0.6"
uuid = { version = "1", features = ["serde"] }
wgpu = "30.0.0"
winit = "0.30.13"
x11-dl = "2.21.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
# deny-warnings lives here (not in RUSTFLAGS) so gate and daily focused tests
# share one build fingerprint; a RUSTFLAGS='-D warnings' toggle invalidates the
# whole /tmp/bbb-target-* cache in both directions.
warnings = "deny"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.fast-test]
inherits = "dev"
opt-level = 0
incremental = true

[profile.fast-test.package."*"]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
