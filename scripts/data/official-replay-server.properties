# What the official Mojang 26.1 server needs to be for the bbb interaction
# replay to run against it, independent of which script booted it.
#
# Every script that boots an official server for the replay reads this file and
# appends only what is its own: the port, the level name, its motd, and — for
# the two that create a world rather than open one — the seed and generator.
# scripts/tests/test_capture_replay_expectations.py keeps them all reading it.
#
# Two seats: the replay observes a second client, so a one-seat server turns
# the peer away and the run never reaches its edits. Creative because the
# replay writes creative slots; peaceful and unprotected because the replay
# breaks and places blocks and must not be interrupted; short distances because
# the replay only ever looks at the chunk it stands in.
online-mode=false
server-ip=127.0.0.1
gamemode=creative
force-gamemode=true
difficulty=peaceful
spawn-protection=0
view-distance=2
simulation-distance=2
max-players=2
