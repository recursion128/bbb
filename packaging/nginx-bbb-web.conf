# Nginx TLS reverse-proxy recipe for bbb-web-host.
# Terminates HTTPS so browsers permit SharedArrayBuffer + WebGPU worker threads,
# enforces COOP/COEP/CORP cross-origin isolation headers on every response,
# upgrades `/ws` to a binary WebSocket relay to 127.0.0.1:8080, and blocks the
# local-only `/control-ws` automation tunnel at the public edge.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name play.example.com;

    ssl_certificate     /etc/ssl/certs/play.example.com.pem;
    ssl_certificate_key /etc/ssl/private/play.example.com.key;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /control-ws {
        return 403;
    }

    location ^~ /control-ws/ {
        return 403;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }
}
